dependencies:
  idf: ">=5.4"
  lvgl/lvgl: "~9.2.2"
  espressif/mdns: "^1.4.0"
  # ESP32-P4 board: ST7701 panel driver, and Wi-Fi through the on-board ESP32-C6
  # (versions as in Waveshare's examples for ESP-IDF 5.5).
  espressif/esp_lcd_st7701:
    version: "^2.0.3"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "1.4.*"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "0.14.*"
    rules:
      - if: "target == esp32p4"
