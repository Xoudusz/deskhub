[package]
name = "deskhub-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "deskhub_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
# preserve_order: rewriting Claude Code's settings.json keeps the user's key order.
serde_json = { version = "1", features = ["preserve_order"] }
# Local time zone offset for the "today" and day buckets of the AI usage.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = "1"
# Plain HTTP only: the board has no TLS. Add a TLS feature when GitHub downloads arrive (M5).
reqwest = { version = "0.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }
base64 = "0.22"
anyhow = "1"
log = "0.4"
sysinfo = "0.37"

# Windows-only collectors (media session, PDH GPU counters, power events, input, audio).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
