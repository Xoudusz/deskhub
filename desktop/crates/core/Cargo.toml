[package]
name = "deskhub-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "deskhub_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Plain HTTP only: the board has no TLS. Add a TLS feature when GitHub downloads arrive (M5).
reqwest = { version = "0.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
base64 = "0.22"
anyhow = "1"
log = "0.4"
