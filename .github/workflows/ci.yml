name: CI

on:
  # Branches only: a tag push runs the release workflows, which build the same thing.
  push:
    branches: ["**"]
  pull_request:

jobs:
  firmware:
    # s3 = Waveshare ESP32-S3-Touch-LCD-4.3B; p4rev1 / p4rev3 = Waveshare
    # ESP32-P4-WIFI6-Touch-LCD-4.3 with chip revision v1.x / v3.x.
    name: Build firmware (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [s3, p4rev1, p4rev3]
    steps:
      - uses: actions/checkout@v4
      # Compiler cache (firmware/build.sh mounts it) and downloaded components: most of
      # the build time without them.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deskhub-ccache
            firmware/managed_components
          key: fw-${{ matrix.variant }}-idf5.5.4-${{ hashFiles('firmware/main/idf_component.yml') }}-${{ github.run_id }}
          restore-keys: |
            fw-${{ matrix.variant }}-idf5.5.4-${{ hashFiles('firmware/main/idf_component.yml') }}-
      - name: Build (ESP-IDF 5.5.4 in Docker)
        run: firmware/build.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: deskhub-firmware-${{ matrix.variant }}
          path: |
            firmware/out/${{ matrix.variant }}/deskhub.bin
            firmware/out/${{ matrix.variant }}/deskhub-merged.bin

  companion:
    name: Companion tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python tests/run_all.py
