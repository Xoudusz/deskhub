name: Desktop app

on:
  # Branches only: a desktop-v tag runs desktop-release.yml instead.
  push:
    branches: ["**"]
    paths: ["desktop/**", "firmware/main/**", "firmware/sim/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "firmware/main/**", "firmware/sim/**", ".github/workflows/desktop.yml"]

jobs:
  sim:
    # The board simulator: the firmware UI built to WASM (firmware/sim/build.sh, emsdk in docker).
    name: Board simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash firmware/sim/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: board-sim
          path: desktop/public/sim/
          if-no-files-found: error

  core:
    # Board protocol, session, settings: plain Rust, tested on Linux.
    name: Core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop -> target
      - run: cargo test -p deskhub-core -p deskhub-cli
      - run: cargo clippy -p deskhub-core -p deskhub-cli --all-targets -- -D warnings

  app:
    # The real app: frontend build plus Tauri shell, packed as an NSIS installer.
    name: Windows installer
    needs: sim
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop -> target
          cache-on-failure: true
          # Same key as desktop-release.yml: a release tag reads this cache from main.
          shared-key: desktop-windows
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: board-sim
          path: desktop/public/sim
      # deskhub-cli ships next to the app (Claude Code status line + hooks); Tauri wants
      # sidecars named with the target triple.
      - run: cargo build --release -p deskhub-cli
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/release/deskhub-cli.exe src-tauri/binaries/deskhub-cli-x86_64-pc-windows-msvc.exe
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: deskhub-desktop-setup
          path: desktop/target/release/bundle/nsis/*.exe
